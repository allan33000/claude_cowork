name: Mio - Leads quotidiens

on:
  schedule:
    # Allan : 6h45 heure de Singapour, jours ouvres (~1h15 avant sa cible 8h,
    # laisse la marge demandee pour que Cowork enrichisse ensuite avant 8h)
    - cron: "45 6 * * 1-5"
      timezone: "Asia/Singapore"
    # Esteban : 6h45 heure de Zurich, meme logique
    - cron: "45 6 * * 1-5"
      timezone: "Europe/Zurich"
  workflow_dispatch:
    inputs:
      recipient:
        description: "Destinataire a construire pour un test manuel"
        required: true
        default: "both"
        type: choice
        options: [allan, esteban, both]

permissions:
  contents: write   # necessaire pour committer le fichier de leads du jour

jobs:
  build-leads:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Determiner le destinataire
        id: recipient
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.recipient }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "45 6 * * 1-5" ] && [ "${{ github.event.schedule_timezone }}" = "Asia/Singapore" ]; then
            echo "value=allan" >> "$GITHUB_OUTPUT"
          else
            echo "value=esteban" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: pip install requests

      - name: Generer les leads
        env:
          FRANCETRAVAIL_CLIENT_ID: ${{ secrets.FRANCETRAVAIL_CLIENT_ID }}
          FRANCETRAVAIL_CLIENT_SECRET: ${{ secrets.FRANCETRAVAIL_CLIENT_SECRET }}
        run: python daily_leads.py ${{ steps.recipient.outputs.value }}

      - name: Envoyer le mail a Allan
        if: steps.recipient.outputs.value == 'allan' || steps.recipient.outputs.value == 'both'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Mio - leads bruts du jour (secours, sans LinkedIn)"
          to: allanmalheiro33@gmail.com
          from: Mio Leads
          html_body: file://leads/email_body_allan.html

      - name: Envoyer le mail a Esteban
        if: steps.recipient.outputs.value == 'esteban' || steps.recipient.outputs.value == 'both'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Mio - leads bruts du jour (secours, sans LinkedIn)"
          to: estebannoeldufour@gmail.com
          from: Mio Leads
          html_body: file://leads/email_body_esteban.html

      - name: Committer le resultat
        # Ce commit sert aussi a garder le repo "actif": GitHub desactive
        # silencieusement les workflows planifies apres 60 jours sans activite.
        run: |
          git config user.name "mio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add leads/
          git diff --cached --quiet && echo "Rien de nouveau" || git commit -m "Leads ${{ steps.recipient.outputs.value }} du $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push

      - name: Signaler un echec
        if: failure()
        run: echo "::error::Le pipeline de leads Mio a echoue - voir les logs ci-dessus."
